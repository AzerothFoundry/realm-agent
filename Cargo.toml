[package]
name = "realm-agent"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Headless 1.12.1 task client with status, event streams and local navigation"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
benilla-protocol = { git = "https://github.com/AzerothFoundry/benilla", rev = "2119c72a4b3d67fa83563fefb4a70d10eddad97d" }
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[build-dependencies]
cc = "1.2.62"

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
